# 这是longtask实例的config示例，不是可单独导入的第二个bundle。
# 把存在的绝对路径填好，再通过DSH宿主修改已安装longtask实例配置。
dataDir: "D:/DSHData/longtask"
agencyAgentsRoot: "D:/Agents/agency-agents"
workerCwd: "D:/Work/my-project"
workerProvider: "deepseek-official"
workerModel: "deepseek-flash"
workerMaxTokens: "host" # 跟随DSH最终请求上限，按该值预留Token和金额
workerParentAgent: "auto"
workerPreset: "standard"
acceptorReadOnly: true
acceptorReadTools: [] # 仅填写宿主已提供、经确认只读的联网/预览/隔离核对工具，禁止写入及任意shell。
toolReadBudget: 0 # 0关闭固定次数提醒；正数仅提醒当前Worker，不禁止必要读取。
acceptanceReadBudgetBytes: 65536 # 未来验收首轮读取规划，不是实际模型请求的预算豁免。
backgroundJobTimeoutMs: 7200000 # 已登记宿主命令的有限等待窗口；超时仍需纠偏。
executorMaxSteps: 0 # 默认不设累计步数硬上限；正整数可显式启用。
acceptorMaxSteps: 0 # 验收默认按实际进展与原预算继续；正数才启用固定硬上限。
acceptorProgressWindowSteps: 8 # 检查点间隔，有新核对证据则继续。
acceptorMaxIdleSteps: 3 # 无新证据先纠偏，再经过同等无进展窗口则暂停。
acceptorToolWaitMs: 15000 # 首步前等待读取工具，期间不调用模型。
maxConcurrentTasks: 2
probeOnStart: true

# 首版内置下列官方Flash高峰价，按保守费用核算，不是平台实扣。
# modelPrices数组会覆盖内置表；配置其他模型时必须填真实路由和核对过的价格。
# 每个价格单位都是人民币元/百万Token，必须使用字符串。
# 到期后请求会暂停；依据官方价格更新表和expiresAt，不要仅延长过期时间。
modelPrices:
  - provider: "deepseek-official"
    model: "deepseek-flash"
    currency: "CNY"
    input: "2"
    cacheRead: "0.04"
    cacheWrite: "2"
    output: "8"
    source: "https://api-docs.deepseek.com/zh-cn/quick_start/pricing/"
    verifiedAt: "2026-11-05T17:20:00Z"
    expiresAt: "2026-12-06T00:00:00+08:00"
    basis: "conservative-ceiling"
